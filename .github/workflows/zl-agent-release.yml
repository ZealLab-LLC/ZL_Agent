# ZealLab Agent release build.
#
# Owned by the ZealLab fork — upstream opencode has no workflow by this name,
# so it never conflicts on a merge. Upstream's own workflows in this directory
# target their release infrastructure and are unused here.
#
# Produces the Linux binaries consumed by the zl-agent Debian package in
# https://github.com/ZealLab-LLC/Packages (see its fetch-agent.sh).
#
# Release a version:
#   git tag v1.0.0 && git push origin v1.0.0
# then bump AGENT_VERSION *and* debian/changelog in the Packages repo.

name: Release ZealLab Agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Reuse the repo's composite action: it pins Bun from package.json
      # packageManager, sets up the Node 24 that node-gyp needs, and caches deps.
      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Resolve version
        id: version
        # packages/script derives the version from `git branch --show-current`,
        # which is empty on a tag checkout (detached HEAD). Left alone it stamps
        # the binary `0.0.0--<timestamp>`, so pass the version in explicitly.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Build binary
        # --single builds only the host platform, which the matrix pins to the
        # architecture we want. The default would build all 12 targets,
        # including macOS, Windows and musl variants we do not ship.
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: latest
        run: bun run --cwd packages/opencode script/build.ts --single

      - name: Package
        run: |
          set -euo pipefail
          BUILT="packages/opencode/dist/opencode-linux-${{ matrix.arch }}/bin/opencode"
          if [ ! -x "$BUILT" ]; then
            echo "Expected binary not found at $BUILT" >&2
            ls -R packages/opencode/dist >&2 || true
            exit 1
          fi

          # The package installs this as /usr/lib/zl-agent/bin/zl-agent and the
          # `zl agent` shim execs it, so ship it under that name.
          mkdir -p stage
          install -m 0755 "$BUILT" "stage/zl-agent"
          tar -czf "zl-agent-linux-${{ matrix.arch }}.tar.gz" -C stage zl-agent
          sha256sum "zl-agent-linux-${{ matrix.arch }}.tar.gz"

      - name: Smoke test
        run: |
          set -euo pipefail
          tar -xzf "zl-agent-linux-${{ matrix.arch }}.tar.gz" -C /tmp
          # Only the native binary can actually run on this runner.
          got=$(/tmp/zl-agent --version)
          echo "zl-agent --version => $got"
          if [ "$got" != "${{ steps.version.outputs.version }}" ]; then
            echo "Version mismatch: expected ${{ steps.version.outputs.version }}, got $got" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zl-agent-linux-${{ matrix.arch }}
          path: zl-agent-linux-${{ matrix.arch }}.tar.gz
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        # fetch-agent.sh in the Packages repo verifies against this file.
        run: |
          set -euo pipefail
          cd dist
          sha256sum zl-agent-linux-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ZealLab Agent ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/zl-agent-linux-x64.tar.gz
            dist/zl-agent-linux-arm64.tar.gz
            dist/checksums.txt
