# ZealLab Agent release build.
#
# Owned by the ZealLab fork — upstream opencode has no workflow by this name,
# so it never conflicts on a merge. Upstream's own workflows in this directory
# target their release infrastructure and are unused here.
#
# Produces the Linux binaries consumed by the zl-agent Debian package in
# https://github.com/ZealLab-LLC/Packages (see its fetch-agent.sh).
#
# Successful dev checks publish the next patch version for Packages to pick up.

name: Release ZealLab Agent

on:
  workflow_run:
    workflows: [test, typecheck]
    types: [completed]
    branches: [dev]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v)"
        required: true

permissions:
  contents: read

concurrency:
  group: zeallab-agent-release
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve release version
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash script/zeallab-release-plan.sh

  build:
    name: Build ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false

      # Reuse the repo's composite action: it pins Bun from package.json
      # packageManager, sets up the Node 24 that node-gyp needs, and caches deps.
      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Build binary
        # --single builds only the host platform, which the matrix pins to the
        # architecture we want. The default would build all 12 targets,
        # including macOS, Windows and musl variants we do not ship.
        env:
          OPENCODE_VERSION: ${{ needs.plan.outputs.version }}
          OPENCODE_CHANNEL: latest
          ZEALLAB_OFFLINE_BUILD: "1"
        run: bun run --cwd packages/cli script/build.ts --single --skip-install --skip-web-ui

      - name: Package
        run: |
          set -euo pipefail
          BUILT="packages/cli/dist/cli-linux-${{ matrix.arch }}/bin/opencode"
          if [ ! -x "$BUILT" ]; then
            echo "Expected binary not found at $BUILT" >&2
            ls -R packages/cli/dist >&2 || true
            exit 1
          fi

          # The package installs this as /usr/lib/zl-agent/bin/zl-agent and the
          # `zl agent` shim execs it, so ship it under that name.
          mkdir -p stage
          install -m 0755 "$BUILT" "stage/zl-agent"
          tar -czf "zl-agent-linux-${{ matrix.arch }}.tar.gz" -C stage zl-agent
          sha256sum "zl-agent-linux-${{ matrix.arch }}.tar.gz"

      - name: Smoke test
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          tar -xzf "zl-agent-linux-${{ matrix.arch }}.tar.gz" -C /tmp
          # Only the native binary can actually run on this runner.
          got=$(/tmp/zl-agent --version)
          echo "zl-agent --version => $got"
          if [ "$got" != "zl agent v$RELEASE_VERSION" ]; then
            echo "Version mismatch: expected $RELEASE_VERSION, got $got" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zl-agent-linux-${{ matrix.arch }}
          path: zl-agent-linux-${{ matrix.arch }}.tar.gz
          retention-days: 7

  release:
    name: Publish release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        # fetch-agent.sh in the Packages repo verifies against this file.
        run: |
          set -euo pipefail
          cd dist
          sha256sum zl-agent-linux-x64.tar.gz zl-agent-linux-arm64.tar.gz > checksums.txt
          cat checksums.txt

      - name: Verify or create the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.commit }}
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          tag_sha=$(awk -v ref="refs/tags/$TAG" '
            $2 == ref { direct = $1 }
            $2 == ref "^{}" { peeled = $1 }
            END { print peeled ? peeled : direct }
          ' <<< "$refs")
          if [[ -z "$tag_sha" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$RELEASE_SHA" --silent
          elif [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "$TAG already points to $tag_sha, expected $RELEASE_SHA." >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.commit }}
          name: ZealLab Agent ${{ needs.plan.outputs.tag }}
          make_latest: ${{ github.event_name == 'workflow_run' && 'true' || 'legacy' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/zl-agent-linux-x64.tar.gz
            dist/zl-agent-linux-arm64.tar.gz
            dist/checksums.txt

  dispatch-packages:
    name: Publish the Agent update to APT
    needs: [plan, release]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Dispatch the Packages publish workflow
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure PACKAGES_DISPATCH_TOKEN with Actions write access to ZealLab-LLC/Packages."
            exit 1
          fi
          gh api --method POST repos/ZealLab-LLC/Packages/actions/workflows/publish.yml/dispatches \
            -f ref=main -f "inputs[agent_version]=$RELEASE_VERSION" --silent
