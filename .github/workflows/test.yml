name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          # ZealLab: upstream also runs a windows leg on Blacksmith runners.
          # This fork has no Blacksmith account and ships Linux only (the
          # zl-agent Debian package), so the matrix is trimmed to one host.
          - name: linux
            host: ubuntu-latest
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install ripgrep for search tests
        run: |
          asset=ripgrep-15.1.0-x86_64-unknown-linux-musl
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$asset.tar.gz" "https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/$asset.tar.gz"
          echo "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599  $asset.tar.gz" | sha256sum --check
          tar -xzf "$asset.tar.gz" "$asset/rg"
          echo "$RUNNER_TEMP/$asset" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run upstream unit tests
        timeout-minutes: 20
        # Use Turbo's Node entry point so Bun does not launch the test orchestrator.
        run: GITHUB_ACTIONS=false node node_modules/turbo/bin/turbo test --concurrency=3 --env-mode=loose
        env:
          ZEALLAB_ALLOW_REMOTE_PROVIDERS: "1"
          ZEALLAB_ALLOW_NETWORK: "1"

      - name: Verify ZealLab's local provider policy
        working-directory: packages/cli
        run: bun test test/zeallab-local.test.ts
